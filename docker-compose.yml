# Local evaluation database only. Never use demo credentials in production.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: iris_demo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - iris_pgdata:/var/lib/postgresql/data
      - ./sql/001_demo_schema.sql:/docker-entrypoint-initdb.d/001_demo_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris_demo"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  iris_pgdata:
